name: Rust
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install pinned browser test tool
        run: npm install --prefix .test-tools --no-save @playwright/cli@0.1.23
      - name: Build and verify release gates
        run: ./build.ps1 -WithUi -ReleaseChecks
