[package]
name = "ilovbee-studio"
version = "0.8.1"
edition = "2021"
license = "MIT"
description = "Native Rust settings host for the BY Tech B87 keyboard"

[lib]
path = "rust/lib.rs"

[[bin]]
name = "iLovbeeStudio"
path = "rust/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tiny_http = "0.12"
url = "2"

[target.'cfg(windows)'.dependencies]
wasapi = "0.27"
windows-sys = { version = "0.61", features = [
  "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_HumanInterfaceDevice",
  "Win32_Devices_Properties", "Win32_Foundation", "Win32_Security",
  "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi"
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
